<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1320">
  <meta name="description" content="ポケモンスリープの希望するサブスキル・性格・食材構成を引ける確率を計算する、オフライン対応の非公式PWA。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>厳選期待値</title>
</head>
<body>
  <div class="background-halo halo-a" aria-hidden="true"></div><div class="background-halo halo-b" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><img src="./assets/icon-192.png" alt="" decoding="async"></span>
        <span class="brand-copy">
          <h1 class="brand-title">厳選<span>期待値</span></h1>
          <span class="brand-subtitle">for Pokémon Sleep</span>
        </span>
      </div>
    </div>
  </header>
  <main class="page">
    <div class="content-layout">
      <div class="form-stack">
        <section class="panel" aria-labelledby="skill-title">
          <div class="panel-heading"><div class="section-index">01</div><div><div class="panel-kicker">TARGET SUB SKILLS</div><h2 id="skill-title">希望のサブスキル</h2></div><span class="panel-counter" id="desired-counter">0 条件</span></div>
          <div id="desired-rows" class="rule-list"></div>
          <button type="button" id="add-desired" class="add-rule"><span class="plus-circle">＋</span>希望条件を追加する</button>
          <div class="thin-divider"></div>
          <label class="switch-row" for="seed-toggle"><span class="switch-copy"><strong>サブスキルのたねを使用</strong></span><input type="checkbox" id="seed-toggle" class="switch-input" checked><span class="switch-visual" aria-hidden="true"></span></label>
          <details class="exclusions-group" id="exclusion-details"><summary><span><svg class="chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg> 除外条件 <span id="exclude-counter" class="little-counter">0</span></span></summary><div class="exclusion-body"><p class="panel-description">指定したサブスキルが、選んだレベルまでに出ないことを条件にします。</p><div id="exclusion-rows" class="rule-list"></div><button type="button" id="add-exclusion" class="add-rule muted"><span class="plus-circle">＋</span>除外条件を追加する</button></div></details>
        </section>
        <section class="panel" aria-labelledby="natures-title">
          <div class="panel-heading"><div class="section-index">02</div><div><div class="panel-kicker">NATURE PREFERENCES</div><h2 id="natures-title">希望の性格</h2></div><span class="panel-counter" id="nature-counter">指定なし</span></div>
          <details class="selection-details" id="natures-details"><summary><span class="selection-summary-left"><span class="summary-icon">✧</span><strong id="nature-summary">性格を選択</strong></span><svg class="chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg></summary><div class="selection-detail-body"><div class="select-tools nature-select-tools"><button type="button" data-clear="nature">選択解除</button></div><div class="nature-groups" id="nature-grid"></div></div></details>
        </section>
        <section class="panel" aria-labelledby="ingredient-title">
          <div class="panel-heading"><div class="section-index">03</div><div><div class="panel-kicker">INGREDIENT PATTERNS</div><h2 id="ingredient-title">希望の食材構成</h2></div><span class="panel-counter" id="ingredient-counter">指定なし</span></div>
          <div class="ingredient-toolbar"><div class="ingredient-pool" id="ingredient-pool" role="group" aria-label="食材の候補数"><button type="button" data-ingredient-pool="3" aria-pressed="true">3種類</button><button type="button" data-ingredient-pool="2" aria-pressed="false">2種類</button></div><button type="button" class="ingredient-clear" data-clear="ingredient">選択解除</button></div>
          <div class="ingredient-grid" id="ingredient-grid"></div>
        </section>
      </div>
      <aside class="side-stack">
        <section id="result-panel" class="result-panel" aria-labelledby="result-title" tabindex="-1">
          <div class="result-topline"><span class="result-eyebrow">YOUR RESULTS</span></div>
          <h2 id="result-title">厳選シミュレーション結果</h2>
          <div id="result-content" class="result-content">
            <div class="comparison-head" role="row"><span>金確定枠</span><span>出現確率</span><span>期待捕獲数</span></div>
            <div id="comparison-rows" class="comparison-rows" aria-live="polite"></div>
            <button class="copy-result" id="copy-result" type="button"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></svg> 結果をコピー</button>
          </div>
          <div class="result-error" id="result-error" hidden></div>
        </section>

      </aside>
    </div>

  </main>
  <div class="action-dock"><div class="action-dock-inner"><div class="dock-summary"><span>シミュレーション</span><strong id="dock-info">条件を設定して計算</strong></div><button type="button" id="reset-button" class="reset-button" aria-label="条件をすべてリセット" title="リセット"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 9a8 8 0 1 1-.5 6.2M4 4v5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" id="run-button" class="run-button"><span class="run-label">確率を計算する</span><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg></button></div></div>


  <dialog id="skill-picker-dialog" class="install-dialog skill-picker-dialog"><div class="dialog-header"><div><h2 id="skill-picker-title">サブスキルを選択</h2></div><button class="dialog-close" id="close-skill-picker" type="button" aria-label="閉じる">×</button></div><div class="dialog-body skill-picker-body"><div id="skill-picker-groups" class="skill-picker-groups"></div></div><div class="skill-picker-footer"><button type="button" class="skill-picker-close" id="skill-picker-close-bottom">閉じる</button></div></dialog>
  <dialog id="reset-dialog" class="install-dialog small-dialog reset-confirm-dialog" aria-labelledby="reset-dialog-title" aria-describedby="reset-dialog-message">
    <div class="dialog-header"><h2 id="reset-dialog-title">設定をリセット</h2><button type="button" id="reset-dialog-close" class="dialog-close" aria-label="閉じる">×</button></div>
    <div class="dialog-body"><p id="reset-dialog-message">すべての条件と計算結果をリセットしますか？</p></div>
    <div class="reset-dialog-actions"><button type="button" id="reset-cancel" class="reset-cancel">キャンセル</button><button type="button" id="reset-confirm" class="reset-confirm">リセットする</button></div>
  </dialog>
  <div id="custom-level-listbox" class="custom-select-menu" role="listbox" aria-label="対象レベルを選択" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
